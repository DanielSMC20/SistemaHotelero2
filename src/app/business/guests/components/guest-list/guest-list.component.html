<div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Gestión de Huespedes</h1>
      <p class="text-gray-600 mt-1">Administra todos los huespedes registrados</p>
    </div>
    <button (click)="registrar()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition-colors flex items-center space-x-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
      <span>Resgistrar huesped</span>
    </button>
  </div>
  
<ag-grid-angular
  class="ag-theme-quartz"
  style="width: 100%; height: 400px;"
  [rowData]="rowData"
  [columnDefs]="columnDefs"
  [gridOptions]="gridOptions">
</ag-grid-angular>
