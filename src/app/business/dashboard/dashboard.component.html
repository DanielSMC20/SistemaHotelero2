<div class="min-h-screen bg-gray-50 flex flex-col items-center py-12">
  <h2 class="text-3xl font-bold text-gray-800 mb-8">Panel de Control</h2>

  <!-- Indicadores de tarjetas -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl w-full px-6">
    <div class="bg-white shadow-md rounded-xl p-6 text-center">
      <p class="text-sm text-gray-500 mb-1">Total Habitaciones</p>
      <h3 class="text-2xl font-bold text-gray-700">{{ totalRooms }}</h3>
    </div>

    <div class="bg-green-100 text-green-800 shadow-md rounded-xl p-6 text-center">
      <p class="text-sm mb-1">Disponibles</p>
      <h3 class="text-2xl font-bold">{{ availableToday }}</h3>
    </div>

    <div class="bg-rose-100 text-rose-800 shadow-md rounded-xl p-6 text-center">
      <p class="text-sm mb-1">Ocupadas</p>
      <h3 class="text-2xl font-bold">{{ occupiedToday }}</h3>
    </div>

    <div class="bg-yellow-100 text-yellow-800 shadow-md rounded-xl p-6 text-center">
      <p class="text-sm mb-1">Ingresos Promedio</p>
      <h3 class="text-2xl font-bold">S/. {{ avgRevenue() }}</h3>
    </div>
  </div>

  <!-- Botones para cambiar rango de fechas -->
  <div class="flex gap-4 mt-6">
    <button (click)="setRange(7)" class="px-4 py-2 bg-indigo-500 text-white rounded-md hover:bg-indigo-600 transition-colors">
      Últimos 7 días
    </button>
    <button (click)="setRange(30)" class="px-4 py-2 bg-indigo-500 text-white rounded-md hover:bg-indigo-600 transition-colors">
      Últimos 30 días
    </button>
  </div>

  <!-- Contenedor principal de los gráficos -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full max-w-5xl px-6 mt-10">
    <!-- Gráfico de ingresos (Línea) -->
    <div class="bg-white shadow-lg rounded-xl p-6">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Ingresos Diarios</h3>
      <div class="chart-container" style="display: block;">
        <canvas baseChart
                [type]="'line'"
                [data]="revenueLineData"
                [options]="revenueLineOptions">
        </canvas>
      </div>
    </div>

    <!-- Gráfico de ocupación (Barras apiladas) -->
    <div class="bg-white shadow-lg rounded-xl p-6">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Ocupación por Día</h3>
      <div class="chart-container" style="display: block;">
        <canvas baseChart
                [type]="'bar'"
                [data]="occupancyBarData"
                [options]="occupancyBarOptions">
        </canvas>
      </div>
    </div>

    <!-- Gráfico de anillo (Ocupación de hoy) -->
    <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-md mx-auto lg:col-span-2">
      <h3 class="text-lg font-semibold text-gray-800 mb-4">Ocupación Actual (Hoy)</h3>
      <div class="chart-container" style="display: block; max-height: 300px;">
        <canvas baseChart
                [type]="'doughnut'"
                [data]="doughnutData"
                [options]="doughnutOptions">
        </canvas>
      </div>
    </div>
  </div>
</div>
