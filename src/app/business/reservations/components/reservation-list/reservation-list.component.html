<div class="w-full space-y-6">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
    <div class="space-y-1">
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900">Reservations</h1>
      <p class="text-slate-500">Gestiona y monitorea las reservas del hotel.</p>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
      <!-- Quick filter -->
      <input
        type="text"
        placeholder="Filtrar…"
        (input)="onQuickFilter($event)"
        class="rounded-xl ring-1 ring-slate-300 px-3 py-2 text-sm w-full sm:w-64"
      />

      <!-- Botón Nueva Reserva -->
      <button
        type="button"
        (click)="create()"
        class="inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-800"
      >
        + Nueva reserva
      </button>

      <!-- Botón Reset -->
      <button
        type="button"
        (click)="reset()"
        class="inline-flex items-center justify-center gap-2 rounded-xl ring-1 ring-slate-300 px-3 py-2 text-sm font-medium hover:ring-slate-400"
      >
        Reset filtros
      </button>
    </div>
  </div>

  <!-- Grid -->
  <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
    <div class="ag-theme-quartz w-full h-[560px]">
      <ag-grid-angular
        class="w-full h-full"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [gridOptions]="gridOptions"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>

<!-- Modal de formulario -->
<app-reservation-form
  *ngIf="showForm"
  [editing]="editing"
  (closed)="onCloseForm($event)">
</app-reservation-form>
