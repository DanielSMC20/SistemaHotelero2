<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">
  <div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">

    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      Registrar  Usuario
    </h2>

    <form class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
        <input 
          type="email"
          class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="admin@hotel.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Clave</label>
        <input 
          type="password"
          class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="••••••••"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombres</label>
        <input 
          type="text"
          class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Daniel Sandro"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
        <input 
          type="text"
          class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Mitma Contreras"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">País</label>
        <input 
          type="text"
          class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Perú"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
        <select 
          class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="ADMIN">ADMIN</option>
          <option value="USER">RECEPCIONISTA</option>

        </select>
      </div>

      <button 
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg transition"
      >
        Guardar
      </button>

    </form>
  </div>
</div>
