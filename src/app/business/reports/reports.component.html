<div class="p-6">
  <h2 class="text-xl font-semibold mb-4">Reporte Diario</h2>

  <div class="flex items-center gap-4 mb-4">
    <label>Fecha:</label>
    <input type="date" [(ngModel)]="selectedDate" class="border rounded px-2 py-1">
    <button (click)="exportToExcel()" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">
      Exportar a Excel
    </button>
  </div>
  <ag-grid-angular
    style="width: 100%; height: 400px;"
    class="ag-theme-quartz"
    [columnDefs]="columnDefs"
    [rowData]="rowData"
    (gridReady)="onGridReady($event)">
  </ag-grid-angular>

  <div class="mt-4 text-right font-semibold">
    Ganancia total del día: <span class="text-green-600">S/ {{ totalIncome }}</span>
  </div>
</div>
