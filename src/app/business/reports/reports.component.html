<div class="p-6">
  <h2 class="text-2xl font-semibold mb-4">Reporte Diario</h2>

  <div class="flex items-center gap-4 mb-4">
    <label>Fecha:</label>
    <input type="date" [(ngModel)]="selectedDate" class="border rounded px-2 py-1" />
    <button (click)="loadReport()"
      class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
      Buscar
    </button>
    <button (click)="exportToExcel()"
      class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Exportar a Excel
    </button>
  </div>

  <ag-grid-angular
    class="ag-theme-alpine w-full"
    style="height: 400px;"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    (gridReady)="onGridReady($event)">
  </ag-grid-angular>

  <div class="mt-4 text-right font-semibold">
    Total Ingresos: S/. {{ totalIncome }}
  </div>
</div>
