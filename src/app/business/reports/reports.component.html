<div class="p-6">
  <h2 class="text-2xl font-semibold mb-4">Reporte Diario</h2>

  <!-- 🔹 Filtros por rango de fechas -->
  <div class="flex flex-wrap items-center gap-4 mb-4">
    <label class="font-medium">Desde:</label>
    <input
      type="date"
      [(ngModel)]="start"
      class="border rounded px-2 py-1"
    />

    <label class="font-medium">Hasta:</label>
    <input
      type="date"
      [(ngModel)]="end"
      class="border rounded px-2 py-1"
    />

    <button
      (click)="loadReport()"
      class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700"
    >
      Buscar
    </button>

    <button
      (click)="exportToExcel()"
      class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
    >
      Exportar a Excel
    </button>
  </div>

  <!-- 🔹 AG Grid con filtros por columna -->
  <ag-grid-angular
    class="ag-theme-alpine w-full"
    style="height: 400px;"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    (gridReady)="onGridReady($event)"
  >
  </ag-grid-angular>

  <div class="mt-4 text-right font-semibold">
    Total Ingresos: S/. {{ totalIncome }}
  </div>
</div>
