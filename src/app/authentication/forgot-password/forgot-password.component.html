<!-- Layout a pantalla completa -->
<div class="min-h-screen bg-slate-950 bg-[radial-gradient(60%_60%_at_50%_0%,rgba(99,102,241,0.18),transparent)] grid place-items-center px-4">
  <!-- Card -->
  <div class="w-full max-w-lg rounded-2xl shadow-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 md:p-8 text-slate-200"
       [formGroup]="form">

    <!-- Header -->
    <div class="mb-6">
      <div class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs bg-indigo-500/15 text-indigo-300 ring-1 ring-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4a2 2 0 00-2 2v1l10 6 10-6V6a2 2 0 00-2-2zm0 6.35l-8.553 5.132a1 1 0 01-1.053 0L2 10.35V18a2 2 0 002 2h16a2 2 0 002-2V10.35z"/></svg>
        Recuperación
      </div>
      <h1 class="mt-3 text-2xl md:text-3xl font-semibold tracking-tight">Recuperar contraseña</h1>
      <p class="mt-1.5 text-sm text-slate-400">Ingresa tu correo y te enviaremos un enlace seguro.</p>
    </div>

    <!-- Email -->
    <label class="block text-sm mb-1.5 text-slate-300">Correo</label>
    <input
      type="email"
      formControlName="email"
      placeholder="tucorreo@dominio.com"
      class="w-full rounded-xl bg-slate-900/70 border border-slate-700 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/20 outline-none px-4 py-2.5"
      [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched ? true : null"
    />
    <p class="text-xs text-slate-500 mt-1">Asegúrate de que sea el correo con el que te registraste.</p>

    <!-- Acciones -->
    <div class="mt-7 flex items-center justify-between gap-4">
      <a routerLink="/login"
         class="text-sm text-slate-400 hover:text-slate-200 underline underline-offset-4">
        Volver
      </a>

      <button
        (click)="submit()"
        [disabled]="form.invalid || loading"
        class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl
               bg-gradient-to-r from-indigo-600 to-fuchsia-600
               hover:from-indigo-500 hover:to-fuchsia-500
               text-white font-medium
               shadow-lg shadow-indigo-900/30
               disabled:opacity-50 disabled:cursor-not-allowed
               focus:outline-none focus:ring-4 focus:ring-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 019 9h-2a7 7 0 10-7 7v-3l5 4-5 4v-3A9 9 0 1112 3z"/></svg>
        {{ loading ? 'Enviando…' : 'Enviar enlace' }}
      </button>
    </div>
  </div>
</div>
