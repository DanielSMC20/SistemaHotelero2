<div class="min-h-dvh grid grid-cols-1 lg:grid-cols-2 bg-slate-950 text-slate-100">
  <div class="flex items-center justify-center p-6 sm:p-10">
    <div class="w-full max-w-md">
      <div class="mb-8">
        <h1 class="text-2xl font-bold tracking-tight">Sign in to your account</h1>
      </div>

      <form class="mt-8 space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
          <label for="username" class="block text-sm font-medium mb-2">Usuario</label>
          <input id="username" type="text" autocomplete="username"
            class="w-full rounded-xl bg-slate-900/60 border border-slate-800 px-4 py-2.5 outline-none placeholder:text-slate-500 focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-colors"
            placeholder="admin, receptionist, manager" formControlName="username">

          <div *ngIf="username?.invalid && username?.touched" class="text-red-400 text-xs mt-1">
            <span *ngIf="username?.errors?.['required']">El usuario es requerido</span>
            <span *ngIf="username?.errors?.['minlength']">Mínimo 3 caracteres</span>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-sm font-medium">Contraseña</label>
            <a class="text-sm text-indigo-400 hover:text-indigo-300 font-medium" href="#"
              (click)="onSubmit(); $event.preventDefault()">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="relative">
            <input id="password" type="password" autocomplete="current-password"
              class="w-full rounded-xl bg-slate-900/60 border border-slate-800 px-4 py-2.5 outline-none placeholder:text-slate-500 focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-colors pr-10"
              placeholder="••••••••" formControlName="password">

            <button type="button" (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center" title="Mostrar/Ocultar contraseña">
              <svg *ngIf="!showPassword" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                </path>
              </svg>
              <svg *ngIf="showPassword" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21">
                </path>
              </svg>
            </button>
          </div>

          <div *ngIf="password?.invalid && password?.touched" class="text-red-400 text-xs mt-1">
            <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
            <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="inline-flex items-center gap-2 text-sm text-slate-300">
            <input type="checkbox"
              class="h-4 w-4 rounded border-slate-700 bg-slate-900/60 checked:bg-indigo-500 checked:border-indigo-500 focus:ring-indigo-500"
              formControlName="rememberMe" id="remember-me">
            <span>Recordarme</span>
          </label>
        </div>

        <div *ngIf="errorMessage" class="bg-red-900/20 border border-red-500/30 rounded-xl p-3">
          <div class="flex items-center text-red-300 text-sm">
            <svg class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
              </path>
            </svg>
            {{ errorMessage }}
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid || loading" class="w-full rounded-xl px-4 py-2.5 font-semibold disabled:opacity-50 disabled:cursor-not-allowed
                 bg-gradient-to-r from-indigo-500 to-violet-500
                 hover:from-indigo-400 hover:to-violet-400
                 focus:outline-none focus:ring-2 focus:ring-indigo-500/40
                 transition-all duration-200 flex items-center justify-center space-x-2">

          <svg *ngIf="!loading" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
          </svg>

          <svg *ngIf="loading" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>

          <span>{{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}</span>
        </button>

        <div class="relative flex justify-center text-sm my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-700"></div>
          </div>
          <span class="relative bg-slate-950 px-3 text-slate-400">Para desarrollo</span>
        </div>

        <div class="text-center">
          <button type="button" class="w-full py-2.5 px-4 border border-slate-700 rounded-xl text-sm font-medium
                   text-slate-300 hover:bg-slate-800/50 focus:outline-none focus:ring-2
                   focus:ring-indigo-500/40 transition-colors">
            👤 Mostrar usuarios de prueba
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="relative hidden lg:block">
    <img src="Loginimagen.jpg" alt="Hotel entrance" class="absolute inset-0 h-full w-full object-cover" />
    <div class="absolute inset-0 bg-slate-900/60"></div>
    <div class="absolute bottom-8 left-8 right-8">
      <h2 class="text-2xl font-bold text-white mb-2">Sistema Hotelero</h2>
      <p class="text-slate-200">Gestión completa de tu hotel</p>
    </div>
  </div>
</div>
