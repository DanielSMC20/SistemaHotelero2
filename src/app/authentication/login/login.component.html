<div class="min-h-dvh grid grid-cols-1 lg:grid-cols-2 bg-slate-950 text-slate-100">
  <!-- Panel izquierdo (form) -->
  <div class="flex items-center justify-center p-6 sm:p-10">
    <div class="w-full max-w-md">
      <!-- Logo / marca -->
      <div class="mb-8">
        <div class="h-10 w-10 rounded-xl bg-indigo-500/20 flex items-center justify-center">
          <svg viewBox="0 0 24 24" class="h-6 w-6 text-indigo-400" fill="currentColor" aria-hidden="true">
            <path d="M12 3l4.5 9H7.5L12 3zm0 18l-4.5-9h9L12 21z"/>
          </svg>
        </div>
      </div>

      <h1 class="text-2xl font-bold tracking-tight">Sign in to your account</h1>
      <p class="mt-2 text-sm text-slate-400">
        Not a member?
        <a class="text-indigo-400 hover:text-indigo-300 font-medium" href="#">Start a 14 day free trial</a>
      </p>

      <form class="mt-8 space-y-5" >
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium mb-2">Email address</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            class="w-full rounded-xl bg-slate-900/60 border border-slate-800 px-4 py-2.5 outline-none
                   placeholder:text-slate-500 focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500
                   transition-colors"
            placeholder="you@example.com"
            formControlName="email" />
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-sm font-medium">Password</label>
            <a class="text-sm text-indigo-400 hover:text-indigo-300 font-medium" href="#">Forgot password?</a>
          </div>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            class="w-full rounded-xl bg-slate-900/60 border border-slate-800 px-4 py-2.5 outline-none
                   placeholder:text-slate-500 focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500
                   transition-colors"
            placeholder="••••••••"
            formControlName="password" />
        </div>

        <!-- Remember me -->
        <div class="flex items-center justify-between">
          <label class="inline-flex items-center gap-2 text-sm text-slate-300">
            <input type="checkbox" class="h-4 w-4 rounded border-slate-700 bg-slate-900/60
                                         checked:bg-indigo-500 checked:border-indigo-500"
                   formControlName="remember" />
            Remember me
          </label>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full rounded-xl px-4 py-2.5 font-semibold
                 bg-gradient-to-r from-indigo-500 to-violet-500
                 hover:from-indigo-400 hover:to-violet-400
                 focus:outline-none focus:ring-2 focus:ring-indigo-500/40
                 transition-colors">
          Sign in
        </button>

        <!-- Divider -->
      

        <!-- Social -->
        
      </form>
    </div>
  </div>

  <!-- Panel derecho (imagen) -->
  <div class="relative hidden lg:block">
    <img src="Loginimagen.jpg" alt="Desk workspace" class="absolute inset-0 h-full w-full object-cover" />
    <div class="absolute inset-0 bg-slate-900/40"></div>
  </div>
</div>
