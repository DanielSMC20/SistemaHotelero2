<!-- Layout a pantalla completa -->
<div class="min-h-screen bg-slate-950 bg-[radial-gradient(60%_60%_at_50%_0%,rgba(99,102,241,0.18),transparent)] grid place-items-center px-4">
  <!-- Card -->
  <div class="w-full max-w-lg rounded-2xl shadow-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 md:p-8 text-slate-200"
       [formGroup]="form">

    <!-- Header -->
    <div class="mb-6">
      <div class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs bg-indigo-500/15 text-indigo-300 ring-1 ring-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V11a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm-3 8V6a3 3 0 116 0v3H9z"/></svg>
        Seguridad
      </div>
      <h1 class="mt-3 text-2xl md:text-3xl font-semibold tracking-tight">Restablecer contraseña</h1>
      <p class="mt-1.5 text-sm text-slate-400">Pega el token del correo y define una nueva contraseña segura.</p>
    </div>

    <!-- Token -->
<!-- Token solo visible si NO vino desde el correo -->
<div *ngIf="!tokenAuto" class="mb-4">
  <label class="block text-sm mb-1.5 text-slate-300">Token</label>
  <input
    type="text"
    formControlName="token"
    placeholder="selector.verifier"
    class="w-full rounded-xl bg-slate-900/70 border border-slate-700 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/20 outline-none px-4 py-2.5"
  />
  <p class="text-xs text-slate-500 mt-1">Pega el token del correo aquí.</p>
</div>


    <!-- Nueva contraseña -->
    <label class="block text-sm mb-1.5 text-slate-300">Nueva contraseña</label>
    <div class="relative mb-2">
      <input
        [type]="hide ? 'password' : 'text'"
        formControlName="newPassword"
        placeholder="Mínimo 8 caracteres"
        class="peer w-full rounded-xl bg-slate-900/70 border border-slate-700 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/20 outline-none px-4 py-2.5 pr-12"
        [attr.aria-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched ? true : null"
      />
      <!-- Toggle ver/ocultar -->
      <button type="button"
              (click)="hide = !hide"
              class="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-slate-400 hover:text-slate-200 hover:bg-white/5 transition">
        <svg *ngIf="hide" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 115-5 5.006 5.006 0 01-5 5z"/></svg>
        <svg *ngIf="!hide" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M2.1 3.51l18.39 18.39-1.41 1.41-2.37-2.37A12.1 12.1 0 0112 19c-7 0-10-7-10-7a21.3 21.3 0 013.83-4.93L.69 4.92zM12 7a5 5 0 013.58 1.49l-1.45 1.45A3 3 0 009 12a3 3 0 002.06 2.86l-1.52 1.52A5 5 0 0112 7z"/><path d="M16.24 13.41l-2.83 2.83A5 5 0 0012 17a5 5 0 01-5-5 5 5 0 01.76-2.59l1.5 1.5A3 3 0 009 12a3 3 0 003 3 3 3 0 001.24-.26z"/></svg>
      </button>
    </div>
    <p class="text-xs text-slate-500 mb-2">Debe incluir mayúsculas, minúsculas, números y símbolos.</p>

    <!-- Barra de fortaleza -->
    <div class="h-2 w-full bg-slate-800 rounded overflow-hidden mb-1.5">
      <div class="h-2"
           [style.width.%]="strength"
           [ngClass]="{
             'bg-rose-500': strength < 50,
             'bg-amber-500': strength >= 50 && strength < 80,
             'bg-emerald-500': strength >= 80
           }">
      </div>
    </div>
    <p class="text-xs"
       [ngClass]="{
         'text-rose-400': strength < 50,
         'text-amber-400': strength >= 50 && strength < 80,
         'text-emerald-400': strength >= 80
       }">
      Fortaleza: {{ strengthLabel }}
    </p>

    <!-- Confirmar contraseña -->
    <label class="block text-sm mt-5 mb-1.5 text-slate-300">Confirmar contraseña</label>
    <input
      [type]="hide ? 'password' : 'text'"
      formControlName="confirmPassword"
      placeholder="Repite la nueva contraseña"
      class="w-full rounded-xl bg-slate-900/70 border border-slate-700 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/20 outline-none px-4 py-2.5"
      [attr.aria-invalid]="(form.hasError('notMatch') || form.controls.confirmPassword.invalid) && form.controls.confirmPassword.touched ? true : null"
    />
    <p class="text-xs text-rose-400 mt-1" *ngIf="form.hasError('notMatch') && form.controls.confirmPassword.touched">
      Las contraseñas no coinciden.
    </p>

    <!-- Acciones -->
    <div class="mt-7 flex items-center justify-between gap-4">
<a routerLink="/login"
   class="text-sm text-slate-400 hover:text-slate-200 underline underline-offset-4">
  Volver
</a>
      <button
        (click)="submit()"
        [disabled]="!canSubmit"
        class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl
               bg-gradient-to-r from-indigo-600 to-fuchsia-600
               hover:from-indigo-500 hover:to-fuchsia-500
               text-white font-medium
               shadow-lg shadow-indigo-900/30
               disabled:opacity-50 disabled:cursor-not-allowed
               focus:outline-none focus:ring-4 focus:ring-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 019 9h-2a7 7 0 10-7 7v-3l5 4-5 4v-3A9 9 0 1112 3z"/></svg>
        {{ loading ? 'Actualizando…' : 'Actualizar contraseña' }}
      </button>
    </div>
  </div>
</div>
